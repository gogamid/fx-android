name: termux-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/termux-build.yml'
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'

permissions:
  contents: read

jobs:
  bionic-pie:
    name: bionic-pie (NDK, direct exec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Android NDK sysroot
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          ln -s "$PWD"/android-ndk-r28 "$HOME/ndk"
          ls "$HOME/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/"

      - name: Write zig libc file
        run: |
          SYS="$HOME/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          API=""
          for v in 36 35 34 33 32 31 30; do
            if [ -d "$SYS/usr/lib/aarch64-linux-android/$v" ]; then API=$v; break; fi
          done
          echo "using API $API"
          echo "API=$API" >> "$GITHUB_ENV"
          # NDK r27+ keeps bionic stubs (libc.so/libm.so/libdl.so) at the top-level
          # lib dir; zig looks for them in crt_dir, so symlink them in.
          CRT="$SYS/usr/lib/aarch64-linux-android/$API"
          for lib in libc.so libdl.so libm.so liblog.so; do
            if [ -f "$SYS/usr/lib/aarch64-linux-android/$lib" ]; then
              ln -sf "../$lib" "$CRT/$lib"
            fi
          done
          ls "$CRT" | head -20
          cat > libc.txt <<EOF
          include_dir=$SYS/usr/include
          sys_include_dir=$SYS/usr/include
          crt_dir=$SYS/usr/lib/aarch64-linux-android/$API
          msvc_lib_dir=
          kernel32_lib_dir=
          gcc_dir=
          EOF
          cat libc.txt

      - name: Build fx (bionic PIE)
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-android.$API -Dpie=true --libc libc.txt
          file zig-out/bin/fx
          readelf -h zig-out/bin/fx | grep -E 'Type|Machine'
          readelf -l zig-out/bin/fx | grep -E 'interpreter|INTERP' || true

      - name: Package
        run: |
          mkdir -p pkg
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md pkg/
          tar -czf fx-bionic-pie.tar.gz -C pkg fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-bionic-pie.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: fx-bionic-pie
          path: fx-bionic-pie.tar.gz
          retention-days: 30

  musl-static:
    name: musl-static (ldnp fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build fx (static musl, non-PIE)
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl
          file zig-out/bin/fx
          readelf -h zig-out/bin/fx | grep -E 'Type|Machine'

      - name: Package
        run: |
          mkdir -p pkg
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md pkg/
          tar -czf fx-musl-static.tar.gz -C pkg fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-musl-static.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: fx-musl-static
          path: fx-musl-static.tar.gz
          retention-days: 30