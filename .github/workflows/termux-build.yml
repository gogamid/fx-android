name: termux-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/termux-build.yml'
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: musl-pie
            target: aarch64-linux-musl
            desc: Static musl PIE (direct exec on Android, no loader needed)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build (${{ matrix.name }})
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dpie=true
          file zig-out/bin/fx
          readelf -h zig-out/bin/fx | grep -E 'Type|Machine' || true

      - name: Package
        run: |
          mkdir -p pkg
          cp zig-out/bin/fx LICENSE THIRD_PARTY_NOTICES.md pkg/
          tar -czf fx-${{ matrix.name }}.tar.gz -C pkg fx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fx-${{ matrix.name }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-${{ matrix.name }}
          path: fx-${{ matrix.name }}.tar.gz
          retention-days: 30